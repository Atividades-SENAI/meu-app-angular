<!doctype html>
<html lang="pt-BR" class="light">
<head>
  <meta charset="utf-8">
  <title>ClimaCast | Dashboard Inteligente de Clima</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Dashboard Inteligente de Clima com previsão em tempo real, métricas avançadas e alternância dinâmica de temas.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- Fontes do Google: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('darkMode');
        if (saved === 'true') {
          document.documentElement.classList.remove('light');
          document.documentElement.classList.add('dark');
        } else if (saved === 'false') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.remove('light');
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
